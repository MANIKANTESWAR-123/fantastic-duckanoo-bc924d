<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sangam / Annapurna Dairy — Daily Ledger</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#35634A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #FAFAF6;
    --surface: #FFFFFF;
    --ink: #2B2620;
    --ink-soft: #6B6355;
    --line: #E1DCCE;
    --green: #35634A;
    --green-soft: #E7EFE7;
    --gold: #B9862E;
    --gold-soft: #FBF1DE;
    --red: #A23E3E;
    --red-soft: #FBEAEA;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 80px;}

  header{margin-bottom:18px;}
  .shop-name{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .shop-sub{
    color:var(--ink-soft);
    font-size:13px;
    margin-top:2px;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }
  .header-rule{
    height:2px;
    background:repeating-linear-gradient(90deg, var(--green) 0 6px, transparent 6px 10px);
    margin:14px 0 0;
    opacity:0.5;
  }

  .tabs{display:flex;gap:6px;margin:20px 0 18px;flex-wrap:wrap;}
  .tab-btn{
    flex:1 1 30%;
    min-width:70px;
    padding:10px 6px;
    border:1px solid var(--line);
    background:var(--surface);
    border-radius:var(--radius);
    font-family:'IBM Plex Sans';
    font-weight:600;
    font-size:12.5px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
  }

  label.field-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--ink-soft);
    font-weight:600;
    display:block;
    margin-bottom:6px;
  }
  input[type=date]{
    font-family:'IBM Plex Mono';
    font-size:15px;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }

  .search-box{
    width:100%;
    font-family:'IBM Plex Sans';
    font-size:14px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fdfcf9;
    color:var(--ink);
    margin-bottom:4px;
  }
  .search-box:focus{outline:none;border-color:var(--green);}

  .legend{
    font-size:11px;color:var(--ink-soft);margin:10px 0 12px;line-height:1.6;
  }
  .legend b{color:var(--ink);}

  .cat-block{
    border:1px solid var(--line);
    border-radius:8px;
    margin-bottom:8px;
    overflow:hidden;
  }
  .cat-header{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 14px;
    background:#F5F2E9;
    cursor:pointer;
    user-select:none;
  }
  .cat-header .cat-title{
    font-family:'Fraunces';font-weight:600;font-size:14.5px;
  }
  .cat-header .cat-meta{
    font-size:12px;color:var(--ink-soft);font-family:'IBM Plex Mono';
    display:flex;align-items:center;gap:8px;
  }
  .cat-chevron{transition:transform 0.15s;display:inline-block;}
  .cat-block.open .cat-chevron{transform:rotate(90deg);}
  .cat-items{padding:10px;display:none;}
  .cat-block.open .cat-items{display:block;}

  .item-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:11px;
    margin-bottom:8px;
    background:#fff;
  }
  .item-card:last-child{margin-bottom:0;}
  .item-head{
    display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap;
  }
  .item-head .item-name{
    flex:1;
    font-family:'IBM Plex Sans';
    font-weight:600;
    font-size:13.5px;
    color:var(--ink);
  }
  .qty-grid{
    display:grid;
    grid-template-columns:repeat(6, 1fr);
    gap:4px;
  }
  .price-grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:7px;
    margin-top:7px;
  }
  .qty-box label{
    font-size:9px;text-transform:uppercase;letter-spacing:0.02em;
    color:var(--ink-soft);font-weight:600;display:block;margin-bottom:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .qty-box input{
    width:100%;
    font-family:'IBM Plex Mono';
    font-size:13.5px;
    text-align:center;
    padding:6px 2px;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fdfcf9;
    color:var(--ink);
  }
  .qty-box.mrp input{background:var(--gold-soft);border-color:#EAD9AE;}
  .qty-box.agent input{background:#EFEAE0;border-color:#DCD3C0;}
  .qty-box.shoprate input{background:#E0F2FE;border-color:#BAE6FD;font-weight:600;color:#0369A1;}
  .qty-box.home input{background:#F0E6EE;border-color:#DCC5D6;}
  .qty-box.sold input{background:var(--green-soft);border-color:#CFE1D2;font-weight:700;}
  .qty-box.leftover input{background:#E3F2FD;border-color:#BBDEFB;font-weight:700;color:#0D47A1;}

  .item-foot{
    display:flex;justify-content:space-between;
    margin-top:7px;font-size:11.5px;color:var(--ink-soft);
    font-family:'IBM Plex Mono';
  }
  .item-foot .amt{font-weight:700;color:var(--ink);font-size:12.5px;}
  .item-foot .margin{color:var(--green);}

  .total-line{
    display:flex;justify-content:space-between;align-items:baseline;
    padding-top:14px;margin-top:14px;
    border-top:2px solid var(--ink);
  }
  .total-line .lbl{font-family:'Fraunces';font-weight:600;font-size:16px;}
  .total-line .val{font-family:'IBM Plex Mono';font-weight:700;font-size:22px;}

  .split-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .split-box{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px;
  }
  .split-box.cash{background:var(--gold-soft);border-color:#EAD9AE;}
  .split-box.online{background:var(--green-soft);border-color:#CFE1D2;}
  .split-box label{
    font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.03em;
    display:block;margin-bottom:6px;color:var(--ink-soft);
  }
  .split-box .cur{font-family:'IBM Plex Mono';font-weight:600;}
  .split-box input{
    width:100%;
    border:none;background:transparent;
    font-family:'IBM Plex Mono';font-size:20px;font-weight:600;
    color:var(--ink);padding:2px 0;
  }
  .split-box input:focus{outline:none;}

  .balance-note{
    margin-top:12px;
    font-size:13px;
    padding:10px 12px;
    border-radius:8px;
    font-weight:500;
  }
  .balance-note.ok{background:var(--green-soft);color:var(--green);}
  .balance-note.off{background:var(--red-soft);color:var(--red);}

  .save-btn{
    width:100%;
    padding:14px;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    font-family:'IBM Plex Sans';
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    margin-top:4px;
  }
  .save-btn:disabled{opacity:0.5;}

  .status-msg{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:16px;
  }

  .hist-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 4px;
    border-bottom:1px solid #F0EDE3;
    cursor:pointer;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-item:hover{background:var(--green-soft);}
  .hist-date{font-family:'Fraunces';font-weight:600;font-size:15px;}
  .hist-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .hist-amt{font-family:'IBM Plex Mono';font-weight:700;font-size:16px;text-align:right;}
  .hist-split{font-size:11px;color:var(--ink-soft);text-align:right;margin-top:2px;font-family:'IBM Plex Mono';}
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .period-summary{
    display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;
  }
  .stat-box{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px;text-align:center;
  }
  .stat-box .n{font-family:'IBM Plex Mono';font-weight:700;font-size:18px;}
  .stat-box .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;}

  .shared-note{
    font-size:12px;color:var(--ink-soft);text-align:center;margin-top:18px;
    padding-top:14px;border-top:1px solid var(--line);
  }
  .no-match{
    text-align:center;color:var(--ink-soft);font-size:13px;padding:16px;
  }

  /* ---- Order box ---- */
  .qty-box.order input{background:#EDEFF7;border-color:#CBD0E8;}
  .order-summary{
    border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:14px;
    background:#F6F5FB;
  }
  .order-summary h4{margin:0 0 8px;font-family:'Fraunces';font-size:14px;font-weight:600;}
  .order-row{display:flex;justify-content:space-between;font-size:12.5px;padding:4px 0;border-bottom:1px dashed #DEDCEC;font-family:'IBM Plex Mono';}
  .order-row:last-child{border-bottom:none;}
  .copy-btn{
    margin-top:10px;width:100%;padding:9px;border-radius:8px;border:1px solid #CBD0E8;
    background:#fff;color:var(--ink);font-family:'IBM Plex Sans';font-weight:600;font-size:12.5px;cursor:pointer;
  }

  /* ---- Sales report ---- */
  .sales-nav{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
  .sales-nav button{
    padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:14px;
  }
  .sales-row{
    display:flex;justify-content:space-between;padding:8px 4px;border-bottom:1px solid #F0EDE3;font-size:13px;
  }
  .sales-row .qty{font-family:'IBM Plex Mono';font-weight:600;}
  .sales-row .amt{font-family:'IBM Plex Mono';color:var(--ink-soft);}
  .range-box{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:16px;}
  .range-inputs{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .range-inputs input{flex:1;font-family:'IBM Plex Mono';padding:7px;border:1px solid var(--line);border-radius:6px;}
  .range-inputs button{padding:8px 12px;border-radius:8px;border:none;background:var(--ink);color:#fff;font-weight:600;font-size:12.5px;cursor:pointer;}

  /* ---- Kirana ---- */
  .shop-select{
    width:100%;font-family:'IBM Plex Sans';font-weight:600;font-size:14px;padding:10px;
    border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:8px;
  }
  .rename-link{font-size:11.5px;color:var(--green);cursor:pointer;text-decoration:underline;margin-bottom:10px;display:inline-block;}
  .kirana-item{
    display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #F0EDE3;
  }
  .kirana-item:last-child{border-bottom:none;}
  .kirana-item .nm{flex:1.6;font-size:12.5px;font-weight:600;}
  .kirana-item input{
    width:100%;font-family:'IBM Plex Mono';font-size:13px;text-align:center;padding:6px 3px;
    border:1px solid var(--line);border-radius:6px;background:#fdfcf9;
  }
  .kirana-item .qf{flex:1;}
  .kirana-item .rf{flex:1;}
  .kirana-item .af{flex:1.1;font-family:'IBM Plex Mono';font-size:12px;text-align:right;color:var(--ink-soft);}
  .balance-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .bal-box{border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center;}
  .bal-box .n{font-family:'IBM Plex Mono';font-weight:700;font-size:18px;}
  .bal-box .l{font-size:11px;color:var(--ink-soft);text-transform:uppercase;margin-top:3px;}
  .bal-box.due{background:var(--red-soft);}
  .bal-box.clear{background:var(--green-soft);}
  .kirana-overview-row{
    display:flex;justify-content:space-between;padding:9px 4px;border-bottom:1px solid #F0EDE3;font-size:13px;cursor:pointer;
  }
  .kirana-overview-row:last-child{border-bottom:none;}
  .kirana-overview-row:hover{background:var(--green-soft);}

  /* ---- Cash ledger ---- */
  .cash-table-row{
    display:grid;grid-template-columns:0.9fr 1fr 1fr 1fr 1fr 1.1fr;gap:4px;padding:8px 2px;
    border-bottom:1px solid #F0EDE3;font-size:10.5px;font-family:'IBM Plex Mono';align-items:center;
    min-width:520px;
  }
  .cash-table-row.head{font-weight:700;color:var(--ink-soft);font-family:'IBM Plex Sans';font-size:9px;text-transform:uppercase;}
  .cash-table-row:last-child{border-bottom:none;}
  #cashLedger{overflow-x:auto;}

  /* ---- Cash in hand ---- */
  .cash-hand-box{
    text-align:center;padding:14px;border-radius:var(--radius);background:var(--gold-soft);border:1px solid #EAD9AE;
  }
  .cash-hand-box .n{font-family:'IBM Plex Mono';font-weight:700;font-size:26px;color:var(--ink);}
  .cash-hand-box .l{font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;margin-top:4px;letter-spacing:0.03em;}
  .cash-hand-actions{display:flex;gap:8px;margin-top:12px;}
  .cash-hand-actions .copy-btn{margin-top:0;}
  .cash-adj-row{
    display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid #F0EDE3;font-size:12px;font-family:'IBM Plex Mono';
  }
  .cash-adj-row:last-child{border-bottom:none;}
  .cash-adj-row .tag{
    font-family:'IBM Plex Sans';font-weight:600;font-size:10.5px;text-transform:uppercase;padding:1px 7px;border-radius:10px;margin-right:6px;
  }
  .cash-adj-row .tag.deposit{background:var(--green-soft);color:var(--green);}
  .cash-adj-row .tag.withdraw{background:var(--red-soft);color:var(--red);}
  .cash-adj-row .tag.recount{background:#EDEFF7;color:#4A4E7A;}

  /* ---- Charts ---- */
  .chart-wrap{position:relative;height:220px;margin-top:6px;}
  .chart-wrap.tall{height:340px;}
  .range-inputs select{
    flex:1;font-family:'IBM Plex Sans';font-size:13px;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);
  }

  /* ---- Quick Entry & Helpers ---- */
  .bulk-box {
    width: 100%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fdfcf9;
    color: var(--ink);
  }
  .action-btn-sm {
    background: none;
    border: 1px solid var(--line);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 11px;
    cursor: pointer;
    font-family: 'IBM Plex Sans';
    color: var(--ink-soft);
  }
  .action-btn-sm:hover { background: #f0ede3; }

  /* ---- Stock Payments ---- */
  .pay-form{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .pay-form input, .pay-form select{
    font-family:'IBM Plex Sans';font-size:13.5px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fdfcf9;
  }
  .pay-form-row{display:flex;gap:8px;align-items:center;}
  .pay-form-row .cur{font-family:'IBM Plex Mono';color:var(--ink-soft);}
  .pay-form-row input{flex:1.4;}
  .pay-form-row select{flex:1;}

  .invoice-head-row{
    display:grid;grid-template-columns:2fr 0.8fr 0.9fr 0.9fr 26px;gap:6px;padding:0 2px;
    font-size:10.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;margin-top:6px;
  }
  .invoice-row{
    display:grid;grid-template-columns:2fr 0.8fr 0.9fr 0.9fr 26px;gap:6px;align-items:center;margin-bottom:6px;
  }
  .invoice-row input{
    font-family:'IBM Plex Sans';font-size:12.5px;padding:8px 7px;border:1px solid var(--line);border-radius:7px;background:#fdfcf9;width:100%;
  }
  .invoice-row .amt-display{
    font-family:'IBM Plex Mono';font-size:12.5px;text-align:right;color:var(--ink-soft);padding-right:4px;
  }
  .invoice-row .row-del{
    border:none;background:none;color:var(--red);font-size:16px;cursor:pointer;padding:0;
  }
  .invoice-total-row{
    display:flex;justify-content:space-between;align-items:center;padding:10px 4px;margin-top:4px;
    border-top:2px solid var(--ink);font-family:'IBM Plex Mono';font-weight:700;font-size:15px;
  }

  /* Modal Overlay */
  .modal-overlay{
    position:fixed;top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.5);display:none;justify-content:center;align-items:center;z-index:9999;padding:16px;
  }
  .modal-box{
    background:#fff;border-radius:12px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 25px rgba(0,0,0,0.2);
  }
  .modal-title{font-family:'Fraunces';font-size:18px;font-weight:700;margin:0 0 12px;color:var(--ink);}
  .modal-field{margin-bottom:12px;}
  .modal-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px;}
  .modal-field input, .modal-field select{width:100%;padding:9px;font-family:'IBM Plex Sans';font-size:14px;border:1px solid var(--line);border-radius:8px;}
  .modal-actions{display:flex;gap:8px;margin-top:16px;}
  .modal-btn{flex:1;padding:10px;border-radius:8px;font-weight:600;font-family:'IBM Plex Sans';cursor:pointer;border:none;}
  .modal-btn.primary{background:var(--green);color:#fff;}
  .modal-btn.secondary{background:#EFEAE0;color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">
  <div id="mainApp">
  <header>
    <h1 class="shop-name">Annapurna Dairy &amp; Foods</h1>
    <div class="shop-sub">Daily Stock &amp; Sales Ledger — Sangam Rate Chart</div>
    <div class="header-rule"></div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tabTodayBtn" onclick="switchTab('today')">Today</button>
    <button class="tab-btn" id="tabSalesBtn" onclick="switchTab('sales')">Sales</button>
    <button class="tab-btn" id="tabKiranaBtn" onclick="switchTab('kirana')">Kirana</button>
    <button class="tab-btn" id="tabHistoryBtn" onclick="switchTab('history')">History</button>
    <button class="tab-btn" id="tabChartsBtn" onclick="switchTab('charts')">📊 Charts</button>
    <button class="tab-btn" id="tabPaymentsBtn" onclick="switchTab('payments')">💰 Stock Pay</button>
  </div>

  <!-- TODAY TAB -->
  <div id="todayTab">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <div>
          <label class="field-label">Date</label>
          <input type="date" id="dateInput">
        </div>
        <button class="action-btn-sm" style="background:var(--red-soft); color:var(--red); border-color:#F5C6CB; padding:8px 10px;" onclick="forceResetDatabaseToAug5()">🧹 Force Reset Database to Aug 5</button>
      </div>

      <!-- OPTION B: QUICK BULK LEFTOVER ENTRY FEATURE -->
      <div style="margin-top: 14px; margin-bottom: 12px; border: 1px solid #BBDEFB; border-radius: 8px; padding: 12px; background: #E3F2FD;">
        <label class="field-label" style="color: #0D47A1;">🌙 Option B: Quick Bulk "Leftover" Text Entry</label>
        <p style="font-size:11.5px; color:#1565C0; margin:0 0 6px;">Type remaining unsold packets at night (e.g. <code>tm 8</code> or <code>curd 12</code>) — <b>Sold</b> calculates automatically!</p>
        <textarea id="quickBulkLeftoverInput" class="bulk-box" rows="2" placeholder="tm 8&#10;fcm 3&#10;curd 12"></textarea>
        <button class="copy-btn" style="background:#0D47A1; color:#fff; border:none; margin-top:6px;" onclick="applyQuickBulkLeftoverText()">Calculate Sold from Leftovers</button>
      </div>

      <!-- QUICK BULK SOLD ENTRY FEATURE -->
